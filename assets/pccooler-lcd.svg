<svg xmlns="http://www.w3.org/2000/svg"
     width="256" height="256" viewBox="0 0 256 256">

  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#444b59"/>
      <stop offset="1" stop-color="#161a24"/>
    </linearGradient>

    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202d40"/>
      <stop offset="1" stop-color="#080d16"/>
    </linearGradient>
  </defs>

  <!-- Display housing -->
  <rect x="39" y="13" width="178" height="230"
        rx="30" fill="url(#body)"
        stroke="#69788d" stroke-width="4"/>

  <!-- LCD screen -->
  <rect x="51" y="25" width="154" height="206"
        rx="20" fill="url(#screen)"/>

  <!-- Clock -->
  <text x="128" y="79"
        fill="#e9f7ff"
        font-family="sans-serif"
        font-weight="bold"
        font-size="31"
        text-anchor="middle">12:48</text>

  <!-- Temperature graph -->
  <polyline
      points="65,139 83,127 101,135 120,109 139,119 158,99 189,113"
      fill="none"
      stroke="#69cfff"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"/>

  <circle cx="158" cy="99" r="5" fill="#69cfff"/>

  <!-- CPU -->
  <text x="70" y="177"
        fill="#64beff"
        font-size="19"
        font-family="sans-serif"
        font-weight="bold">CPU</text>

  <text x="70" y="207"
        fill="#ffffff"
        font-size="25"
        font-family="sans-serif"
        font-weight="bold">42°</text>

  <!-- GPU -->
  <text x="150" y="177"
        fill="#ff8c46"
        font-size="19"
        font-family="sans-serif"
        font-weight="bold">GPU</text>

  <text x="150" y="207"
        fill="#ffffff"
        font-size="25"
        font-family="sans-serif"
        font-weight="bold">53°</text>

</svg>
